name: Release

on:
  push:
    branches: [main]
    paths:
      - src-tauri/tauri.conf.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-monitor-release
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Resolve release version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $exists = git tag --list "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$([string]::IsNullOrWhiteSpace($exists).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: steps.version.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@stable

      - if: steps.version.outputs.publish == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - if: steps.version.outputs.publish == 'true'
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - if: steps.version.outputs.publish == 'true'
        uses: haskell-actions/hlint-setup@v2

      - if: steps.version.outputs.publish == 'true'
        name: Install frontend dependencies
        run: npm ci --prefix frontend

      - if: steps.version.outputs.publish == 'true'
        name: Update Cabal package index
        working-directory: backend
        run: cabal update

      - if: steps.version.outputs.publish == 'true'
        name: Verify all language boundaries
        shell: pwsh
        run: ./scripts/build.ps1 check

      - if: steps.version.outputs.publish == 'true'
        name: Configure signed updater
        shell: pwsh
        run: |
          $pubkey = (Get-Content -Raw src-tauri/updater.pubkey).Trim()
          $config = [ordered]@{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{
              pubkey = $pubkey
              endpoints = @('https://github.com/Flechazo098/server-monitor/releases/latest/download/latest.json')
              windows = @{ installMode = 'passive' }
            }}
          } | ConvertTo-Json -Compress -Depth 8
          "TAURI_CONFIG=$config" >> $env:GITHUB_ENV

      - if: steps.version.outputs.publish == 'true'
        name: Build signed NSIS bundle and updater package
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build.ps1 bundle

      - if: steps.version.outputs.publish == 'true'
        name: Write updater manifest
        shell: pwsh
        run: ./scripts/write-update-manifest.ps1 -Version '${{ steps.version.outputs.version }}' -Repository '${{ github.repository }}'

      - if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Server Monitor v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            release/latest.json
