[package]
name = "server-monitor"
version = "0.1.0"
description = "Server Monitor desktop shell (Tauri 2)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
